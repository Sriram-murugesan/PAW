[project]
name = "paw"
version = "0.1.0"
description = "PAW backend: domain services and local REST API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "pydantic>=2.10",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["httpx>=0.27", "import-linter>=2.1", "mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
paw-backend = "paw.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # The specification names HTTPX; Starlette now prefers a different package.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.mypy]
strict = true
packages = ["paw"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"paw/db/migrations/versions/*" = ["E501"]

[tool.importlinter]
root_package = "paw"

[[tool.importlinter.contracts]]
name = "Dependencies point one way"
type = "layers"
layers = ["paw.main", "paw.api", "paw.services", "paw.schemas", "paw.models", "paw.db", "paw.core"]
